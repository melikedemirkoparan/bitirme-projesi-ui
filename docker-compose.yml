services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: patent_user
      POSTGRES_PASSWORD: patent_pass_password123
      POSTGRES_DB: patent_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Seed data — loaded automatically by the postgres image ONLY on a fresh
      # (empty) pgdata volume. A clean clone therefore starts with the demo
      # patents/research reports already in place. See seed/README.md.
      - ./seed/patent_db_seed.sql:/docker-entrypoint-initdb.d/01_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patent_user -d patent_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://patent_user:patent_pass_password123@db:5432/patent_db
      APP_HOST: "0.0.0.0"
      APP_PORT: "8000"
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - appdata:/app/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  appdata:
