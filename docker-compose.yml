services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: patent_user
      POSTGRES_PASSWORD: patent_pass_password123
      POSTGRES_DB: patent_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # NOTE: Seed auto-load is intentionally DISABLED on this branch. The app
      # starts with an EMPTY database — no demo patents. Users create their own
      # projects via "+ New Project". To load the demo data manually, see
      # seed/README.md (the SQL file is still in the repo for that purpose).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patent_user -d patent_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://patent_user:patent_pass_password123@db:5432/patent_db
      APP_HOST: "0.0.0.0"
      APP_PORT: "8000"
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - appdata:/app/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  appdata:
